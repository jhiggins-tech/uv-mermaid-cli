[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uv-mermaid-cli"
version = "0.1.0"
description = "CLI tool to convert Mermaid diagrams to images using Playwright"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
keywords = ["mermaid", "diagram", "cli", "playwright", "screenshot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "click>=8.0",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
mermaid-cli = "mermaid_cli.cli:main"

[project.urls]
Homepage = "https://github.com/jhiggins-tech/uv-mermaid-cli"
Repository = "https://github.com/jhiggins-tech/uv-mermaid-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/mermaid_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
